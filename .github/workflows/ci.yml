name: CI

# SCRATCH, not for merge: runs of the shared chain with the plugin inputs on (UAMS-Web/uams-claude-skills#607).
# The branch is removed by the operator after the runs are read.

on:
  push:
    branches: [scratch/607-plugin-chain]

permissions:
  contents: read

jobs:
  plugin-on:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@200584d8864e515a8f4801851fdf0cf6ae72e523
    with:
      linux-only: true
      mutate: false
      mutate-ignore-paths: includes
      floor-lint: true
      download-archive: true
      phpcs: true
      pest-command: composer test:unit

  phpcs-fails:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@200584d8864e515a8f4801851fdf0cf6ae72e523
    with:
      linux-only: true
      mutate: false
      mutate-ignore-paths: includes
      floor-lint: true
      download-archive: true
      phpcs: true
      phpcs-command: 'false'
      pest-command: composer test:unit
